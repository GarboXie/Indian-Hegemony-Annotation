<div class="columns">
  <div class="column">
    <label class="label">Name</label>
    <input class="input" name="annotator_name" required readonly
           value="{% if draft %}{{ draft.annotator_name }}{% else %}{{ user.username }}{% endif %}">
  </div>
  <div class="column">
    <label class="label">Study Location</label>
    <p>Taiwan</p>
    <input type="hidden" name="region" value="Taiwan">
    <input type="hidden" name="state" value="Taiwan">
    <div hidden>
      <select id="Region"><option value="Taiwan" selected>Taiwan</option></select>
      <select id="State"><option value="Taiwan" selected>Taiwan</option></select>
    </div>
  </div>
</div>
