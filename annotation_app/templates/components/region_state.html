<div class="columns">
  <div class="column">
    <label class="label">Name</label>
    <input class="input" name="annotator_name" required readonly
           value="{% if draft %}{{ draft.annotator_name }}{% else %}{{ user.username }}{% endif %}">
  </div>
  <div class="column">
    <label class="label">Study Location</label>
    <p>Hong Kong</p>
    <input type="hidden" name="region" value="Hong Kong">
    <input type="hidden" name="state" value="Hong Kong">
    <div hidden>
      <select id="Region"><option value="Hong Kong" selected>Hong Kong</option></select>
      <select id="State"><option value="Hong Kong" selected>Hong Kong</option></select>
    </div>
  </div>
</div>
