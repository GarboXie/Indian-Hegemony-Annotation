{% for axis in hegemony_axes %}
{% set axis_data = draft.outputs[model][kind].hegemony.get(axis, {}) if draft else {} %}
<div class="box">

  <label class="label">{{ axis|capitalize }} Hegemony</label>

  <div class="field">
    <div class="control">

      <label class="radio">
        <input type="radio"
               name="{{ model }}_{{ kind }}_{{ axis }}_hegemony"
               value="yes"
               data-hegemony-yes-radio="true"
               {% if axis_data.get("present") == "yes" %}checked{% endif %}>
        Yes
      </label>

      <label class="radio ml-4">
        <input type="radio"
               name="{{ model }}_{{ kind }}_{{ axis }}_hegemony"
               value="no"
               {% if axis_data.get("present", "no") == "no" %}checked{% endif %}>
        No
      </label>

    </div>
  </div>

  <label class="label mt-2">{{ axis|capitalize }} Reason</label>
  <textarea class="textarea"
            name="{{ model }}_{{ kind }}_{{ axis }}_impact"
            data-hegemony-impact-input="true"
            rows="2"
            placeholder="Fill reason only if 'Yes'">{{ axis_data.get("impact", "") }}</textarea>

</div>
{% endfor %}
